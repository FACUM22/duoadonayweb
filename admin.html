<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin</title>

<style>
body { font-family: Arial; margin:0; background:#f5f5f5; }
h1 { background:#ff5722; color:white; padding:15px; text-align:center; }

table {
  width:100%;
  background:white;
  display:block;
  overflow-x:auto;
  border-collapse:collapse;
}

th,td {
  padding:10px;
  border:1px solid #ccc;
  text-align:center;
}

button { padding:5px; margin:2px; }
</style>
</head>

<body>

<h1>📊 Pedidos</h1>

<table>
<thead>
<tr>
<th>Nombre</th>
<th>Tel</th>
<th>Total</th>
<th>Estado</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tabla"></tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>

// 🔐 PROTECCIÓN
if (localStorage.getItem("admin") !== "true") {
  window.location.href = "admin-login.html";
}

// 🔥 FIREBASE (IMPORTANTE)
const firebaseConfig = {
  apiKey: "AIzaSyC01qhZDgo4y45-YNxovIzJJrvGqiJK0fA",
  authDomain: "duo-adonay.firebaseapp.com",
  projectId: "duo-adonay",
  storageBucket: "duo-adonay.firebasestorage.app",
  messagingSenderId: "1053035827307",
  appId: "1:1053035827307:web:4aab2045c0b1733f1d612e",
  measurementId: "G-YMXCYQP7BB"
};
const db = firebase.database();

// 📦 CARGAR PEDIDOS
db.ref("pedidos").on("value", snap => {

  const data = snap.val();
  const tabla = document.getElementById("tabla");

  tabla.innerHTML = "";

  if (!data) {
    tabla.innerHTML = "<tr><td colspan='5'>No hay pedidos</td></tr>";
    return;
  }

  for (let id in data) {
    let p = data[id];

    tabla.innerHTML += `
      <tr>
        <td>${p.nombre}</td>
        <td>${p.telefono}</td>
        <td>$${p.total}</td>
        <td>${p.estado}</td>
        <td>
          <button onclick="estado('${id}','entregado')">✔</button>
          <button onclick="eliminar('${id}')">❌</button>
        </td>
      </tr>
    `;
  }

});

// 🔄 ESTADO
function estado(id,e){
  db.ref("pedidos/"+id).update({estado:e});
}

// ❌ ELIMINAR
function eliminar(id){
  db.ref("pedidos/"+id).remove();
}

</script>

</body>
</html>
