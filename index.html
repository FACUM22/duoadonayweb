<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dúo Adonay</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #fff3e0;
  margin: 0;
}

h1 {
  background: #ff5722;
  color: white;
  padding: 15px;
}

input {
  width: 90%;
  padding: 10px;
  margin: 5px;
}

button {
  padding: 10px;
  background: #ff5722;
  color: white;
  border: none;
  margin: 10px;
}
</style>
</head>

<body>

<h1>🍔 Dúo Adonay</h1>

<div id="menu">
  <p>Simple $100</p>
  <input type="number" id="simple" value="0" onchange="actualizarTotal()">

  <p>Completa $150</p>
  <input type="number" id="completa" value="0" onchange="actualizarTotal()">

  <p>Combo $1550</p>
  <input type="number" id="combo" value="0" onchange="actualizarTotal()">

  <p id="total">Total: $0</p>

  <button onclick="irAlPedido()">Continuar</button>
</div>

<div id="pedido" style="display:none;">
  <input type="text" id="nombre" placeholder="Nombre"><br>
  <input type="text" id="telefono" placeholder="Teléfono"><br>
  <input type="text" id="direccion" placeholder="Dirección"><br>

  <button onclick="pagar()">Pagar</button>
</div>

<!-- 🔐 BOTÓN ADMIN -->
<button onclick="irAdmin()" style="
position:fixed;
bottom:10px;
right:10px;
z-index:9999;
background:#333;
color:white;
border-radius:50%;
width:50px;
height:50px;
font-size:20px;
">
⚙️
</button>

<script>
function irAdmin(){
  window.location.href = "admin-login.html";
}

function irAlPedido() {
  document.getElementById("menu").style.display = "none";
  document.getElementById("pedido").style.display = "block";
}

function calcularTotal() {
  const simple = Number(document.getElementById("simple").value || 0);
  const completa = Number(document.getElementById("completa").value || 0);
  const combo = Number(document.getElementById("combo").value || 0);

  return simple * 100 + completa * 150 + combo * 1550;
}

function actualizarTotal() {
  document.getElementById("total").innerText = "Total: $" + calcularTotal();
}

function pagar() {
  const nombre = document.getElementById("nombre").value;
  const telefono = document.getElementById("telefono").value;
  const direccion = document.getElementById("direccion").value;

  const simple = Number(document.getElementById("simple").value || 0);
  const completa = Number(document.getElementById("completa").value || 0);
  const combo = Number(document.getElementById("combo").value || 0);

  fetch("https://duoadonay.onrender.com/crear-pago", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ nombre, telefono, direccion, simple, completa, combo })
  })
  .then(res => res.json())
  .then(data => {
    window.location.href = data.init_point;
  });
}
</script>

</body>
</html>
